title: "Power Automateを「自分しか直せないフロー」にしない本——命名・設計・運用・引き継ぎの実務"
summary: |
  Power Automateは、誰でもすぐにフローを作れます。その手軽さの裏返しで、半年後には「作った本人しか直せない」「本人も覚えていない」フローが社内に増えていきます。
  この本は、大企業でAI・業務自動化の推進を担当する立場から、フローを属人化させないための実務をまとめたものです。命名とテンプレート、作る前に決めること、本番運用のミス、承認フロー、エラー処理と通知、外部APIとの接続、棚卸しと引き継ぎまで、Microsoftの公式ガイダンスを根拠にしながら、現場で使える形に整理しました。
  巻末には、そのまま社内レビューに使える設計チェックリストを付けています。「はじめに」と第1章・第2章は無料で読めます。
